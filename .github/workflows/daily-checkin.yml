name: daily check-in

# 每日签到 + 积分任务。上游一天只能签一次（重复调用返回 2016），所以这个 job 多跑几次也无害。
#
# 需要在仓库里配置一个 secret：
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  ZHIJU_TOKEN
#   Value: 上游会话 JWT —— 路由器上 `head -1 /opt/zhiju2api/tokens.txt`
#
# 时间：cron 是 UTC，'6 22 * * *' = 次日 06:06 北京时间。
#
# ⚠ 实测结论（2026-10-20，本仓库真跑过两次）：
#   上游对**数据中心/代理 IP** 一律回 HTTP 405，家宽 IP 正常。GitHub 托管 runner 就是数据中心，
#   所以这个 job 在 GitHub 上**跑不成**——secret 与令牌都没问题（脚本解出 EMEM / 剩余 92 天），
#   三个接口全是 405。脚本带退避重试，但这是 IP 策略，重试无效。
#
#   可用的两条路：
#     1) 路由器自己的定时任务（已配 SIGNIN_AT=06:06，幂等，推荐）；
#     2) 给这个仓库挂一台家宽上的 self-hosted runner，再把 runs-on 改成 self-hosted。
#
#   另外 GitHub 会在仓库 60 天无活动后自动停用定时 workflow。

on:
  schedule:
    - cron: '6 22 * * *'
  workflow_dispatch:
    inputs:
      gateway:
        description: '可选：改走自家网关（填 http://host:8080），留空则直连上游'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查 secret 是否配置
        env:
          ZHIJU_TOKEN: ${{ secrets.ZHIJU_TOKEN }}
        run: |
          if [ -z "$ZHIJU_TOKEN" ]; then
            echo "::error title=缺少 ZHIJU_TOKEN::在 Settings -> Secrets and variables -> Actions 里添加 ZHIJU_TOKEN（路由器上 head -1 /opt/zhiju2api/tokens.txt）"
            exit 2
          fi
          echo "secret 已配置（长度 ${#ZHIJU_TOKEN}）"

      - name: 签到并做任务
        id: checkin
        env:
          ZHIJU_TOKEN: ${{ secrets.ZHIJU_TOKEN }}
          ZHIJU_GATEWAY: ${{ inputs.gateway }}
          ZHIJU_PANEL_PASSWORD: ${{ secrets.ZHIJU_PANEL_PASSWORD }}
        run: |
          set +e
          node tools/daily-checkin.mjs 2>&1 | tee /tmp/checkin.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # 把脚本输出变成注解：job 日志需要 token 才能读，注解不需要。
            echo "::error title=签到失败（退出码 $code）::逐行见下面注解"
            tail -n 40 /tmp/checkin.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=checkin::$line"
            done
          fi
          exit "$code"

      - name: 结果摘要
        if: always()
        run: echo "本步骤结果：${{ steps.checkin.outcome }}（明细见上方日志与本次运行的 Summary）"
