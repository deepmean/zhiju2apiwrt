name: daily check-in

# 每日签到 + 积分任务。上游一天只能签一次（重复调用返回 2016），所以这个 job 多跑几次也无害。
#
# 需要在仓库里配置一个 secret：
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  ZHIJU_TOKEN
#   Value: 上游会话 JWT（路由器上 /opt/zhiju2api/tokens.txt 的第一行）
#
# cron 是 UTC。22:06 UTC = 次日 06:06 北京时间。
# GitHub 的定时任务在高峰期可能延迟几分钟到几十分钟，也会在仓库 60 天无活动后自动停用 ——
# 想更可靠就让路由器自己的定时任务（SIGNIN_ENABLED=true）继续跑，两边都是幂等的。

on:
  schedule:
    - cron: '6 22 * * *'
  workflow_dispatch:
    inputs:
      gateway:
        description: '可选：改走自家网关（填 http://host:8080），留空则直连上游'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查 secret 是否配置
        env:
          ZHIJU_TOKEN: ${{ secrets.ZHIJU_TOKEN }}
        run: |
          if [ -z "$ZHIJU_TOKEN" ]; then
            echo "::error title=缺少 ZHIJU_TOKEN::在 Settings -> Secrets and variables -> Actions 里添加 ZHIJU_TOKEN（上游会话 JWT）"
            exit 2
          fi
          echo "secret 已配置（长度 ${#ZHIJU_TOKEN}）"

      - name: 签到并做任务
        env:
          ZHIJU_TOKEN: ${{ secrets.ZHIJU_TOKEN }}
          ZHIJU_GATEWAY: ${{ inputs.gateway }}
          ZHIJU_PANEL_PASSWORD: ${{ secrets.ZHIJU_PANEL_PASSWORD }}
        run: node tools/daily-checkin.mjs

      - name: 结果
        if: always()
        run: |
          echo "退出码：${{ steps.checkin.outcome }}" >/dev/null 2>&1 || true
          echo "见上面的日志与本次运行的 Summary"
