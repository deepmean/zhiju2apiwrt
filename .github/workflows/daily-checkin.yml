name: daily check-in

# 每日签到 + 积分任务。上游一天只能签一次（重复调用返回 2016），所以这个 job 多跑几次也无害。
#
# 需要在仓库里配置一个 secret：
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  ZHIJU_TOKEN
#   Value: 上游会话 JWT —— 路由器上 `head -1 /opt/zhiju2api/tokens.txt`
#
# 时间：cron 是 UTC，'6 22 * * *' = 次日 06:06 北京时间。
#
# ⚠ 两条实测限制：
#   1. 上游对**数据中心/代理 IP** 会回 HTTP 405（家宽 IP 正常）。GitHub 的 runner 就是数据中心，
#      所以这个 job 有可能被拦；脚本已带退避重试，但仍可能失败。
#      最可靠的是路由器自己的定时任务（SIGNIN_ENABLED=true + SIGNIN_AT=06:06），两者幂等可并存。
#   2. 仓库 60 天无活动后，GitHub 会自动停用定时 workflow。
#
# 想在 GitHub 上稳定跑，就给这个仓库挂一台家宽上的 self-hosted runner：
#   Settings -> Actions -> Runners -> New self-hosted runner

on:
  schedule:
    - cron: '6 22 * * *'
  workflow_dispatch:
    inputs:
      gateway:
        description: '可选：改走自家网关（填 http://host:8080），留空则直连上游'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检查 secret 是否配置
        env:
          ZHIJU_TOKEN: ${{ secrets.ZHIJU_TOKEN }}
        run: |
          if [ -z "$ZHIJU_TOKEN" ]; then
            echo "::error title=缺少 ZHIJU_TOKEN::在 Settings -> Secrets and variables -> Actions 里添加 ZHIJU_TOKEN（路由器上 head -1 /opt/zhiju2api/tokens.txt）"
            exit 2
          fi
          echo "secret 已配置（长度 ${#ZHIJU_TOKEN}）"

      - name: 签到并做任务
        id: checkin
        env:
          ZHIJU_TOKEN: ${{ secrets.ZHIJU_TOKEN }}
          ZHIJU_GATEWAY: ${{ inputs.gateway }}
          ZHIJU_PANEL_PASSWORD: ${{ secrets.ZHIJU_PANEL_PASSWORD }}
        run: node tools/daily-checkin.mjs

      - name: 结果摘要
        if: always()
        run: echo "本步骤结果：${{ steps.checkin.outcome }}（明细见上方日志与本次运行的 Summary）"
